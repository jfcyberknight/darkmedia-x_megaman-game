<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e15" />
    <title>Megaman-style Web Game</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d0e15;
        overflow: hidden;
        /* Mobile: no scroll/bounce/zoom while playing */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh; /* mobile browsers: exclude URL bar */
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        box-shadow: 0 0 80px rgba(0, 0, 0, 0.65);
      }

      /* ---- Virtual pad overlay (created by src/touch.ts) ---- */
      #touch-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        font-family: monospace;
      }
      .tc-dpad, .tc-actions {
        position: absolute;
        bottom: calc(18px + env(safe-area-inset-bottom));
        display: flex;
        gap: 14px;
        pointer-events: none;
      }
      .tc-dpad { left: calc(16px + env(safe-area-inset-left)); }
      .tc-actions { right: calc(16px + env(safe-area-inset-right)); align-items: flex-end; }
      .tc-btn {
        pointer-events: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #c7d2e8;
        background: rgba(13, 14, 21, 0.55);
        border: 2px solid rgba(53, 224, 255, 0.45);
        border-radius: 50%;
        box-shadow: 0 0 12px rgba(53, 224, 255, 0.15), inset 0 0 8px rgba(53, 224, 255, 0.08);
        text-shadow: 0 0 6px rgba(53, 224, 255, 0.6);
        touch-action: none;
      }
      .tc-dir { width: 58px; height: 58px; font-size: 20px; }
      .tc-round { width: 66px; height: 66px; font-size: 18px; font-weight: bold; }
      .tc-fire { margin-right: 6px; border-color: rgba(255, 85, 70, 0.5); color: #ffb3a8;
                 box-shadow: 0 0 12px rgba(255, 85, 70, 0.15), inset 0 0 8px rgba(255, 85, 70, 0.08);
                 text-shadow: 0 0 6px rgba(255, 85, 70, 0.6); }
      .tc-jump { width: 76px; height: 76px; font-size: 20px; }
      .tb-active {
        /* Pas de transform ici : un bouton qui rétrécit sous le doigt déclenche
           des pointerleave parasites. On ne fait qu'éclaircir. */
        background: rgba(53, 224, 255, 0.3);
      }
      .tc-utils {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tc-mini {
        pointer-events: auto;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        color: #9fb4d8;
        background: rgba(13, 14, 21, 0.55);
        border: 1.5px solid rgba(159, 180, 216, 0.35);
        border-radius: 8px;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
