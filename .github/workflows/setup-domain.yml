name: Setup custom domain

on:
  workflow_dispatch:

jobs:
  attach-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Attach mega-blaster.darkmedia-x.com to Pages project + DNS
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          DOMAIN="mega-blaster.darkmedia-x.com"
          PROJECT="megaman-game"

          echo "::group::1. Attach domain to Pages project ($PROJECT)"
          CODE=$(curl -s -o attach.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$DOMAIN\"}")
          cat attach.json
          echo
          if [ "$CODE" = "200" ]; then
            echo "Domain attached to the Pages project."
          else
            echo "::warning::Attach returned HTTP $CODE — it may already exist, or the token lacks Pages:Edit."
          fi
          echo "::endgroup::"

          echo "::group::2. Create proxied CNAME (requires DNS:Edit on the token)"
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=darkmedia-x.com" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result'][0]['id'] if d.get('result') else '')")
          if [ -n "$ZONE_ID" ]; then
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"type\":\"CNAME\",\"name\":\"mega-blaster\",\"content\":\"$PROJECT.pages.dev\",\"proxied\":true}" \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print('DNS:', 'created/ok' if d.get('success') else d)"
          else
            echo "::warning::Zone darkmedia-x.com not visible with this token — add the CNAME manually:"
            echo "  CNAME  mega-blaster  ->  $PROJECT.pages.dev  (proxied)"
          fi
          echo "::endgroup::"

          echo "::group::3. Status"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT/domains" \
            -H "Authorization: Bearer $CF_API_TOKEN" | python3 -m json.tool | head -40
          echo "::endgroup::"
          echo "Done. SSL certificate provisioning can take a few minutes."
