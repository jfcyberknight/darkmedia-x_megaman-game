name: Setup AI binding

on:
  workflow_dispatch:

jobs:
  attach-ai-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Attach Workers AI binding to Pages project
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          PROJECT="megaman-game"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PROJECT"

          echo "::group::1. Read current project config"
          curl -s "$BASE" -H "Authorization: Bearer $CF_API_TOKEN" > proj.json
          jq '{success, errors, name: .result.name, configs: .result.deployment_configs}' proj.json | head -30
          echo "::endgroup::"

          echo "::group::2. Merge AI binding into deployment_configs"
          jq '.result.deployment_configs | (.production.ai = {}) | (.preview.ai = {})' proj.json > dc.json
          jq -n --slurpfile dc dc.json '{deployment_configs: $dc[0]}' > patch.json
          echo "PATCH payload:"
          head -c 600 patch.json
          echo
          echo "::endgroup::"

          echo "::group::3. PATCH project"
          curl -s -X PATCH "$BASE" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @patch.json > patched.json
          jq '{success, errors, ai_production: .result.deployment_configs.production.ai, ai_preview: .result.deployment_configs.preview.ai}' patched.json
          echo "::endgroup::"

          echo "If success=true: redeploy the site (Build and Deploy workflow) so the binding goes live."
