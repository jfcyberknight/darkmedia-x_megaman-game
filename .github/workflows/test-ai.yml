name: Test Workers AI

on:
  workflow_dispatch:

jobs:
  test-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Models list
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          echo "Models:"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/models/search?per_page=5" -H "Authorization: Bearer $CF_API_TOKEN" > models.json
          jq '.success, ([.result[].name] | .[0:5])' models.json || true
      - name: Inference test
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -e
          echo '{"messages":[{"role":"user","content":"Dis bonjour en une phrase courte."}]}' > req.json
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/meta/llama-3.2-1b-instruct" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" -d @req.json > resp.json
          jq '{success, response: (.result.response // null), errors}' resp.json || cat resp.json
