name: Test Workers AI

on:
  workflow_dispatch:

jobs:
  test-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Check AI access (models list)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "::group::Models available (first 5)"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/models/search?per_page=5" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
if d.get('success'):
    for m in d['result'][:5]:
        print(' -', m.get('name'))
else:
    print('FAILED:', d.get('errors'))
"
          echo "::endgroup::"

      - name: Run inference (llama-3.2-1b)
        env:
          CF_API_TOKEN: ${{ secrets.CF_ACCOUNT_ID && secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "::group::Inference test"
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/@cf/meta/llama-3.2-1b-instruct" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Réponds en une seule phrase courte: pourquoi Mega Man X est un jeu classique?"}]}' \
            | python3 -c "
import sys, json
d = json.load(sys.stdin)
if d.get('success'):
    print('AI RESPONSE:', d['result'].get('response', '')[:400])
else:
    print('FAILED:', d.get('errors'))
"
          echo "::endgroup::"
